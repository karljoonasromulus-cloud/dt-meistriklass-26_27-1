<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="assets/styles/_reset.css" />
    <link rel="stylesheet" href="assets/styles/fonts.css" />
    <link rel="stylesheet" href="assets/styles/variables.css" />
    <link rel="stylesheet" href="assets/styles/typography.css" />
    <link rel="stylesheet" href="assets/styles/style.css" />
    <script src="assets/scripts/utilities.js"></script>
    <script src="assets/scripts/time.js"></script>
    <script src="assets/scripts/script.js"></script>
    <title>Meistriklass</title>
  </head>
  <body>
    <div class="site">
      <pre id="output"></pre>
      <main class="main">


        <div class="bars">
          <div id="bars-hour" class="bars__unit"></div>
          <div id="bars-minute" class="bars__unit"></div>
          <div id="bars-second" class="bars__unit"></div>
        </div>

        <div class="grid">
          <div id="grid-hour" class="grid__unit"></div>
          <div id="grid-minute" class="grid__unit"></div>
          <div id="grid-second" class="grid__unit"></div>
        </div>

        <div class="clock">
          <div id="clock-hour" class="clock__unit"></div>
          <div id="clock-minute" class="clock__unit"></div>
          <div id="clock-second" class="clock__unit"></div>
        </div>

      </main>
    </div>
